<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour | Elite Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #F5C24C; --dark-gold: #D4A017; --bg: #050505; }
        body { background: var(--bg); font-family: 'Poppins', sans-serif; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .gold-text { background: linear-gradient(135deg, #fff5c0, var(--gold), var(--dark-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .glass-panel { background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(245, 194, 76, 0.2); backdrop-filter: blur(20px); border-radius: 35px; }
        
        input { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(245, 194, 76, 0.1) !important; color: white !important; transition: 0.3s; }
        input:focus { border-color: var(--gold) !important; outline: none; box-shadow: 0 0 15px rgba(245, 194, 76, 0.2); }
        
        #admin-content { display: none; width: 100%; max-width: 450px; }
        
        .btn-gold { background: linear-gradient(135deg, var(--gold), var(--dark-gold)); color: black; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; cursor: pointer; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(245, 194, 76, 0.4); }
        .btn-gold:active { transform: scale(0.98); }

        /* Success Popup */
        #success-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE -->
    <div id="login-gate" class="w-full max-w-md glass-panel p-10 text-center shadow-2xl">
        <h1 class="text-3xl font-bold gold-text mb-2" style="font-family: 'Cinzel';">ADMIN LOGIN</h1>
        <p class="text-zinc-500 text-[10px] tracking-[4px] uppercase mb-8">Secure Gateway</p>
        
        <div class="space-y-4">
            <input type="text" id="admin-user" placeholder="Username" class="w-full p-4 rounded-2xl text-sm">
            <input type="password" id="admin-pass" placeholder="Password" class="w-full p-4 rounded-2xl text-sm">
            <button onclick="handleLogin()" class="w-full btn-gold py-4 rounded-2xl text-xs mt-4">Verify Identity</button>
        </div>
        <p id="login-error" class="text-red-500 text-[10px] mt-4 opacity-0 transition-opacity">Invalid Credentials</p>
    </div>

    <!-- MAIN ADMIN PANEL -->
    <div id="admin-content">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold gold-text" style="font-family: 'Cinzel';">COMMAND CENTER</h2>
            <p class="text-zinc-500 text-[10px] tracking-[3px] uppercase">Glamour Payment Settings</p>
        </div>

        <div class="glass-panel p-8 shadow-2xl">
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1 tracking-widest">Bank Name</label>
                    <input type="text" id="bankName" class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1 tracking-widest">Account Number</label>
                    <input type="text" id="accountNumber" class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1 tracking-widest">Account Holder</label>
                    <input type="text" id="accountHolder" class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1 tracking-widest">Redirect (Telegram)</label>
                    <input type="text" id="telegramLink" class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
            </div>

            <!-- This is the button -->
            <button id="update-btn" onclick="saveSettings()" class="w-full btn-gold py-5 rounded-2xl mt-10 text-xs">
                Update System Live
            </button>
            
            <button onclick="location.reload()" class="w-full text-zinc-600 hover:text-zinc-400 text-[10px] uppercase font-bold tracking-widest mt-6">
                <i class="fas fa-power-off mr-2"></i> Log Out
            </button>
        </div>
    </div>

    <!-- Success Modal Popup -->
    <div id="success-modal">
        <div class="bg-[#111] border border-gold p-10 rounded-[40px] text-center max-w-xs w-full mx-4">
            <div class="w-20 h-20 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-check text-green-500 text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">SYSTEM UPDATED</h3>
            <p class="text-zinc-500 text-xs mb-8">The payment page has been updated successfully for all users.</p>
            <button onclick="closeSuccess()" class="w-full btn-gold py-4 rounded-2xl text-[10px]">Got it</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQcchP6Ze2-9-L0iPjhdg8ahS3HZ-KkXk",
            authDomain: "glamour-miraclenetwork.firebaseapp.com",
            projectId: "glamour-miraclenetwork",
            storageBucket: "glamour-miraclenetwork.firebasestorage.app",
            messagingSenderId: "828763013594",
            appId: "1:828763013594:web:032d4ed7d72f0f2f90c0e3",
            measurementId: "G-T9HY205QVB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const settingsRef = ref(db, 'paymentSettings');

        // Global functions
        window.handleLogin = () => {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            if(user === "AdminMiracle" && pass === "GlamourMiracle") {
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                // Pull current data immediately after login
                onValue(settingsRef, (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        document.getElementById('bankName').value = data.bankName || "";
                        document.getElementById('accountNumber').value = data.accountNumber || "";
                        document.getElementById('accountHolder').value = data.accountHolder || "";
                        document.getElementById('telegramLink').value = data.telegramLink || "";
                    }
                }, { onlyOnce: true });
            } else {
                document.getElementById('login-error').style.opacity = '1';
            }
        };

        window.saveSettings = async () => {
            const btn = document.getElementById('update-btn');
            btn.innerText = "Updating...";
            btn.disabled = true;

            const updateData = {
                bankName: document.getElementById('bankName').value,
                accountNumber: document.getElementById('accountNumber').value,
                accountHolder: document.getElementById('accountHolder').value,
                telegramLink: document.getElementById('telegramLink').value
            };

            try {
                await set(settingsRef, updateData);
                document.getElementById('success-modal').style.display = 'flex';
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.innerText = "Update System Live";
                btn.disabled = false;
            }
        };

        window.closeSuccess = () => {
            document.getElementById('success-modal').style.display = 'none';
        };
    </script>
</body>
</html>
