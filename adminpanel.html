<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour Admin | Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #F5C24C; --bg: #050505; }
        body { background: var(--bg); font-family: 'Poppins', sans-serif; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .gold-text { background: linear-gradient(135deg, #fff5c0, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass { background: rgba(15, 15, 15, 0.95); border: 1px solid rgba(245, 194, 76, 0.2); border-radius: 30px; }
        input { background: rgba(255, 255, 255, 0.05)!important; border: 1px solid rgba(245, 194, 76, 0.1)!important; color: white!important; }
        input:focus { border-color: var(--gold)!important; outline: none; }
        #admin-ui { display: none; width: 100%; max-width: 450px; }
        #success-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-gate" class="glass p-10 w-full max-w-md text-center">
        <h1 class="text-3xl font-bold gold-text mb-6" style="font-family: 'Cinzel';">ADMIN LOGIN</h1>
        <input type="text" id="user" placeholder="Username" class="w-full p-4 rounded-xl mb-4">
        <input type="password" id="pass" placeholder="Password" class="w-full p-4 rounded-xl mb-6">
        <button onclick="login()" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-700 text-black font-bold py-4 rounded-xl">ENTER SYSTEM</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-ui" class="glass p-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold gold-text" style="font-family: 'Cinzel';">COMMAND CENTER</h2>
            <p id="db-status" class="text-[10px] text-red-500 font-bold uppercase tracking-widest mt-1">● DB Disconnected</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1">Bank Name</label>
                <input type="text" id="bankName" class="w-full p-4 rounded-xl text-sm">
            </div>
            <div>
                <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1">Account Number</label>
                <input type="text" id="accountNumber" class="w-full p-4 rounded-xl text-sm">
            </div>
            <div>
                <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1">Account Holder</label>
                <input type="text" id="accountHolder" class="w-full p-4 rounded-xl text-sm">
            </div>
            <div>
                <label class="text-[10px] text-zinc-500 uppercase font-bold ml-1">Telegram Link</label>
                <input type="text" id="telegramLink" class="w-full p-4 rounded-xl text-sm">
            </div>
            <button id="save-btn" onclick="pushUpdate()" class="w-full bg-white text-black font-black py-5 rounded-2xl mt-4 uppercase text-xs tracking-widest shadow-xl">Update Payment Page</button>
        </div>
    </div>

    <!-- SUCCESS POPUP -->
    <div id="success-modal">
        <div class="bg-[#111] border border-yellow-500 p-8 rounded-3xl text-center max-w-xs w-full">
            <i class="fas fa-check-circle text-green-500 text-5xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">LIVE UPDATED</h3>
            <p class="text-zinc-500 text-xs mb-6">The payment page now reflects your new details.</p>
            <button onclick="closeModal()" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl">CONTINUE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQcchP6Ze2-9-L0iPjhdg8ahS3HZ-KkXk",
            authDomain: "glamour-miraclenetwork.firebaseapp.com",
            projectId: "glamour-miraclenetwork",
            storageBucket: "glamour-miraclenetwork.firebasestorage.app",
            messagingSenderId: "828763013594",
            appId: "1:828763013594:web:032d4ed7d72f0f2f90c0e3",
            measurementId: "G-T9HY205QVB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const settingsRef = ref(db, 'paymentConfig');

        window.login = () => {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === "AdminMiracle" && p === "GlamourMiracle") {
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('admin-ui').style.display = 'block';
                
                // Check connection and fetch data
                onValue(settingsRef, (snap) => {
                    document.getElementById('db-status').innerText = "● DB Connected";
                    document.getElementById('db-status').classList.replace('text-red-500', 'text-green-500');
                    const data = snap.val();
                    if(data) {
                        document.getElementById('bankName').value = data.bank || "";
                        document.getElementById('accountNumber').value = data.acc || "";
                        document.getElementById('accountHolder').value = data.name || "";
                        document.getElementById('telegramLink').value = data.link || "";
                    }
                });
            } else { alert("Invalid!"); }
        };

        window.pushUpdate = async () => {
            const btn = document.getElementById('save-btn');
            btn.innerText = "PUSHING DATA...";
            
            const payload = {
                bank: document.getElementById('bankName').value,
                acc: document.getElementById('accountNumber').value,
                name: document.getElementById('accountHolder').value,
                link: document.getElementById('telegramLink').value
            };

            try {
                await set(settingsRef, payload);
                document.getElementById('success-modal').style.display = 'flex';
            } catch(e) { alert("Error: Check Firebase Rules!"); }
            btn.innerText = "Update Payment Page";
        };

        window.closeModal = () => document.getElementById('success-modal').style.display = 'none';
    </script>
</body>
</html>
