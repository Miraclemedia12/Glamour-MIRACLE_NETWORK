<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Portal | Glamour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #F5C24C; --bg: #0e0e0e; }
        body { background: var(--bg); font-family: 'Poppins', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .gold-text { background: linear-gradient(135deg, #fff5c0, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { width: 95%; max-width: 420px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(245, 194, 76, 0.15); border-radius: 35px; padding: 30px; margin-top: 40px; }
        .acc-box { background: rgba(245, 194, 76, 0.05); border: 1px solid rgba(245, 194, 76, 0.1); border-radius: 20px; padding: 20px; }
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); }
        .loader { border: 3px solid rgba(245, 194, 76, 0.1); border-top: 3px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="mt-12 text-center">
        <h1 class="text-2xl font-bold gold-text" style="font-family: 'Cinzel';">GLAMOUR PAYMENT</h1>
        <p class="text-zinc-500 text-[9px] uppercase tracking-[4px]">Verified Security</p>
    </div>

    <div class="card">
        <div class="text-center mb-8">
            <p class="text-zinc-400 text-xs mb-1 uppercase tracking-widest">Amount to Pay</p>
            <p class="text-4xl font-black text-white">₦12,500</p>
        </div>

        <div class="acc-box mb-8">
            <div class="mb-4">
                <p class="text-zinc-500 text-[9px] uppercase font-bold">Bank</p>
                <p id="bank" class="text-lg font-semibold italic text-zinc-300">Loading...</p>
            </div>
            <div class="mb-4">
                <p class="text-zinc-500 text-[9px] uppercase font-bold">Account Number</p>
                <div class="flex items-center justify-between">
                    <p id="acc" class="text-2xl font-black gold-text tracking-widest">----------</p>
                    <button onclick="copyAcc()" class="bg-yellow-500 text-black text-[9px] font-bold px-3 py-1 rounded">COPY</button>
                </div>
            </div>
            <div>
                <p class="text-zinc-500 text-[9px] uppercase font-bold">Holder</p>
                <p id="holder" class="text-sm font-medium">Loading...</p>
            </div>
        </div>

        <button onclick="openPopup()" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-700 text-black py-5 rounded-2xl font-black uppercase text-xs tracking-widest">I Have Made Payment</button>
    </div>

    <!-- POPUP -->
    <div id="popup">
        <div class="bg-[#111] border border-yellow-500/30 p-8 rounded-[40px] text-center w-80 mx-4" id="modal-ui">
            <h3 class="text-lg font-bold gold-text mb-4">UPLOAD RECEIPT</h3>
            <label class="block w-full border-2 border-dashed border-zinc-800 p-10 rounded-3xl cursor-pointer hover:bg-white/5 transition mb-6">
                <input type="file" class="hidden" onchange="fileSelected(this)">
                <i class="fas fa-camera text-3xl text-zinc-700 mb-2" id="cam-icon"></i>
                <p class="text-zinc-500 text-[10px]" id="file-msg">Tap to upload proof</p>
            </label>
            <button id="verify-btn" onclick="verify()" class="w-full bg-zinc-900 text-zinc-600 py-4 rounded-xl font-bold uppercase text-xs cursor-not-allowed" disabled>Verify Now</button>
        </div>

        <!-- LOADER -->
        <div class="hidden flex flex-col items-center" id="loader-ui">
            <div class="loader mb-4"></div>
            <p class="gold-text font-bold italic">Confirming Payment...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQcchP6Ze2-9-L0iPjhdg8ahS3HZ-KkXk",
            authDomain: "glamour-miraclenetwork.firebaseapp.com",
            projectId: "glamour-miraclenetwork",
            storageBucket: "glamour-miraclenetwork.firebasestorage.app",
            messagingSenderId: "828763013594",
            appId: "1:828763013594:web:032d4ed7d72f0f2f90c0e3",
            measurementId: "G-T9HY205QVB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const settingsRef = ref(db, 'paymentConfig');
        let redirectLink = "https://t.me/Haltimo";

        // Listen for changes
        onValue(settingsRef, (snap) => {
            const data = snap.val();
            if(data) {
                document.getElementById('bank').innerText = data.bank;
                document.getElementById('acc').innerText = data.acc;
                document.getElementById('holder').innerText = data.name;
                redirectLink = data.link;
            }
        });

        window.copyAcc = () => {
            navigator.clipboard.writeText(document.getElementById('acc').innerText);
            alert("Copied!");
        };

        window.openPopup = () => document.getElementById('popup').style.display = 'flex';

        window.fileSelected = (input) => {
            if(input.files.length > 0) {
                document.getElementById('file-msg').innerText = "Receipt Loaded";
                document.getElementById('file-msg').style.color = "#4ADE80";
                document.getElementById('cam-icon').style.color = "#4ADE80";
                const btn = document.getElementById('verify-btn');
                btn.disabled = false;
                btn.classList.replace('bg-zinc-900', 'bg-white');
                btn.classList.replace('text-zinc-600', 'text-black');
            }
        };

        window.verify = () => {
            document.getElementById('modal-ui').style.display = 'none';
            document.getElementById('loader-ui').classList.remove('hidden');
            
            setTimeout(() => {
                const user = JSON.parse(localStorage.getItem('glamour_reg_data')) || { name: "User", user: "User" };
                const msg = `👑 *NEW PAYMENT*%0A%0A*Name:* ${user.name}%0A*User:* @${user.user}%0A*Amt:* ₦14,000%0A%0AActivate account.`;
                window.location.href = `${redirectLink}?text=${msg}`;
            }, 3000);
        };
    </script>
</body>
</html>
